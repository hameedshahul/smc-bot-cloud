name: SMC Real Data - No API Key
on:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas pytz requests

      - name: Run SMC Bot - Find file anywhere
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          echo "Listing files:"
          ls -R
          FILE=$(find . -type f -name "cloud_cron_NO_API_KEY.py" | head -n 1)
          echo "Found file at: $FILE"
          if [ -z "$FILE" ]; then
            FILE=$(find . -type f -name "*cloud_cron*.py" | head -n 1)
            echo "Fallback found: $FILE"
          fi
          python "$FILE"
